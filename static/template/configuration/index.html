<div class="panel">
    <div class="section">
        <h3>Server Configuration</h3>
        <div class="row">
            <ui-label>Server Port</ui-label>
            <ui-num-input id="port-input" value="0" step="1"></ui-num-input>
            <ui-button id="save-port-btn" class="blue">Update</ui-button>
        </div>
    </div>

    <div class="section">
        <h3>UTCP Configuration</h3>
        <div class="row">
            <ui-label>Config Path</ui-label>
            <ui-input id="utcp-config-path" class="flex-1"></ui-input>
            <ui-button id="save-utcp-path-btn" class="green"><ui-icon value="check"></ui-icon></ui-button>
        </div>
        <div class="group-header">Bridge Templates</div>
        <div id="bridge-container" class="list-container"></div>
        <div class="group-header mt-10">Add New Template</div>
        <div class="add-template-container">
            <ui-textarea id="new-template-json" placeholder='{"name":"my-bridge","call_template_type":"http","url":"http://..."}' rows="5"></ui-textarea>
            <div class="actions right">
                <ui-button id="add-bridge-btn" class="green"><ui-icon value="add"></ui-icon> Add Template</ui-button>
            </div>
        </div>
    </div>

    <div class="section">
        <h3>MCP Agent Integration</h3>
        <div class="desc-container">Add this server to MCP config. Example:</div>
        <div class="code-container">
            <ui-code language="json" id="mcp-config-code"></ui-code>
        </div>
    </div>
</div>
